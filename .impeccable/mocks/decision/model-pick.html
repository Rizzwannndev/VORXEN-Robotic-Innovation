<html><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:900px;overflow:hidden;background:#050607;color:#D8F3FF;font-family:"Martian Mono",monospace}
body{background:repeating-linear-gradient(0deg,rgba(108,225,255,.04) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 45%,#0d1a20,#050607 60%)}
.log{position:absolute;left:56px;top:120px;width:360px;font-size:12px;line-height:2;color:#6CE1FF;opacity:.8}

.frame{position:absolute;left:520px;top:110px;width:400px;height:600px}

.robot{position:absolute;left:600px;top:150px;width:240px;height:520px;border-radius:110px 110px 20px 20px;background:linear-gradient(#1B2228,#0c1114);border:1px solid #6CE1FF55}
h1{position:absolute;left:56px;bottom:56px;font-family:Michroma;font-size:110px;letter-spacing:.06em}
.side{position:absolute;right:56px;top:120px;width:300px;font-size:12px;line-height:2.2}
.bar{height:4px;background:#1B2228;margin:4px 0 14px}.bar span{display:block;height:100%;background:#6CE1FF}
nav{position:absolute;left:56px;right:56px;top:36px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em}

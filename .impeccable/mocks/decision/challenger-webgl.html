<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:900px;overflow:hidden;color:#F2F4FF;font-family:Archivo,sans-serif}
body{background:radial-gradient(ellipse 60% 50% at 30% 60%,#2B46FF 0,transparent 60%),radial-gradient(ellipse 50% 60% at 75% 30%,#1a2bb8 0,transparent 60%),radial-gradient(circle at 60% 75%,#FF6A3D55,transparent 30%),#070B24}
.grain{position:absolute;inset:0;background:repeating-radial-gradient(circle at 10% 10%,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
h1{position:absolute;left:40px;right:40px;top:300px;font-size:300px;font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.85}
.robot{position:absolute;left:820px;top:120px;width:300px;height:640px;border-radius:150px 150px 20px 20px;background:linear-gradient(#F2F4FF22,#F2F4FF05);border:1px solid #F2F4FF33}
.l{position:absolute;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
</style></head><body><div class="grain"></div>
<div class="robot"></div>
<h1>VORXEN</h1>
<div class="l" style="left:40px;top:40px">Vorxen®</div><div class="l" style="right:40px;top:40px">Menu</div>
<div class="l" style="left:40px;bottom:40px">Robotic innovation — 2026</div><div class="l" style="right:40px;bottom:40px">100%</div>
</body></html>
